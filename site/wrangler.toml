name = "clrsweb-site"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

# Create the database once with: npx wrangler d1 create clrsweb-site-events
# then paste its id below and apply schema.sql: npx wrangler d1 execute clrsweb-site-events --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "clrsweb-site-events"
database_id = "dc2e5bf6-3a89-4ca3-8485-7eeec2771971"

# Secret (never in this file): npx wrangler pages secret put SITE_STATS_TOKEN   (32+ random characters; the same value goes in crm .env)
