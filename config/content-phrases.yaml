# Wording the AI may not use in a post it drafts for you (LinkedIn, Instagram, TikTok).
# The CRM checks every AI draft against this file and against your earlier posts, asks the AI again if it finds one, and refuses the draft if it still does.
# Your own typing is never checked: these rules are only for what the AI writes.
#
# generic: phrases most people posting in your niches use. Add any you are tired of seeing; remove one if you want it back.
#   - Capitals and punctuation do not matter. A phrase matches whole words only.
#   - End a word with * to catch its other endings: "streamlin*" finds streamline, streamlined and streamlining.
# allowed_repeats: phrases that ARE allowed to appear in more than one post (a product name, your sign-off).
#   Everything else may be used once: a second post has to say it in different words, from a different angle.

